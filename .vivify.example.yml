# .vivify.yml — auto-generated by `vivify init`. Edit freely.
# Documentation: https://github.com/pinsonchen/vivify/tree/main/docs

version: 1
mode: daemon                # daemon | once | dry-run
interval_seconds: 300
state_dir: .vivify
log_dir: .vivify/logs
write_mode: pr              # PR mode is the only supported write path

pr:
  base_branch: main
  branch_prefix: vivify/
  auto_merge: false         # turn on once branch protection requires checks
  labels: ["vivify"]
  draft_default: false

agent:
  type: qodercli
  qodercli:
    binary_path: qodercli   # falls back to `shutil.which`
    model: ultimate
    max_turns_fix: 30
    max_turns_develop: 100
    timeout_fix_seconds: 1800
    timeout_develop_seconds: 3600
    extra_args: ["--yolo", "-q"]
    max_concurrent_processes: 10

storage:
  type: sqlite              # sqlite | remote
  sqlite:
    path: .vivify/state.db

github:
  enabled: true
  repo: ""                  # auto-detected from `git remote` when empty
  token_env: GH_TOKEN
  mirror_issues: true

probes:
  enabled:
    - ci_status
    - dependency_vulnerabilities
    - test_coverage
    - error_log_patterns
    - lint_typecheck
    - github_issue_backlog
    - build_duration
    - repo_size
    - doc_staleness
    - dead_code
    - stale_branches
    - secrets_scan
  user_probes_dir: .vivify/probes
  per_probe_timeout_seconds: 120

fixers:
  enabled:
    - dependency_bump
    - lint_autofix
    - format_autofix
    - test_flake_retry
    - stale_branch_prune
    - doc_link_check
  user_fixers_dir: .vivify/fixers

goals:
  path: GOALS.md
  decompose_interval_hours: 24
  decompose_on_change: true
  max_features_per_decompose: 3

escalation:
  max_same_issue_rounds: 3
  upgrade_threshold: 3
  low_cooldown_seconds: 21600
  medium_cooldown_seconds: 3600

kpi_monitor:
  enabled: true
  check_interval_hours: 24
  degrade_ratio: 0.8
  baseline_window_days: 30

self_growth:
  enabled: false            # opt-in: lets vivify modify its own probes/fixers
  kernel_modification: pr_with_two_approvals  # or never_allowed
  test_command: "pytest -x tests/unit"
