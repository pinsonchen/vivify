<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vivify Dashboard</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
</head>
<body>
    <header>
        <div class="header-left">
            <h1>复元·Vivify</h1>
            <span id="status-indicator" class="status-dot offline"></span>
            <span id="status-text">离线</span>
        </div>
        <div class="header-right">
            <div class="instance-selector">
                <select id="instance-select" onchange="switchInstance(this.value)">
                    <option value="">加载中...</option>
                </select>
                <span class="instance-status-badge" id="instance-status-badge"></span>
            </div>
            <span id="project-info"></span>
        </div>
    </header>

    <nav class="tabs">
        <button class="tab" data-tab="instances">实例</button>
        <button class="tab active" data-tab="overview">概览</button>
        <button class="tab" data-tab="issues">问题</button>
        <button class="tab" data-tab="actions">动作</button>
        <button class="tab" data-tab="features">特性</button>
        <button class="tab" data-tab="alerts">告警</button>
        <button class="tab" data-tab="trends">趋势</button>
    </nav>

    <main>
        <!-- 实例 Tab -->
        <section id="tab-instances" class="tab-content">
            <div class="instance-overview" id="instance-overview">
                <!-- 动态填充：当前实例详情卡片 -->
            </div>
            <div class="instances-grid" id="instances-grid">
                <!-- 动态填充：所有实例卡片 -->
            </div>
        </section>

        <!-- 概览 Tab -->
        <section id="tab-overview" class="tab-content active">
            <div class="cards">
                <div class="card">
                    <h3>守护状态</h3>
                    <div id="daemon-status">-</div>
                </div>
                <div class="card">
                    <h3>最新轮次</h3>
                    <div id="latest-round">-</div>
                </div>
                <div class="card">
                    <h3>操作统计</h3>
                    <div id="action-stats">-</div>
                </div>
                <div class="card">
                    <h3>特性进度</h3>
                    <div id="feature-stats">-</div>
                </div>
            </div>
            <!-- 特性状态统计卡片 -->
            <div class="stats-grid" id="overview-stats-grid"></div>
            <!-- 最近活动区域 -->
            <div class="recent-activity" id="recent-activity">
                <h3>最近活动</h3>
                <div class="recent-activity-list" id="recent-activity-list">
                    <div style="color:var(--text-muted);font-size:0.85rem;padding:1rem">加载中...</div>
                </div>
            </div>
            <div class="log-panel">
                <h3>实时日志</h3>
                <div id="log-stream" class="log-container"></div>
            </div>
            <!-- 配置完整性卡片 -->
            <div class="config-health-card" id="config-health">
                <h3>配置完整性</h3>
                <div class="config-health-summary" id="config-health-summary"></div>
                <div class="config-health-checks" id="config-health-checks"></div>
            </div>
        </section>

        <!-- 问题 Tab -->
        <section id="tab-issues" class="tab-content">
            <div class="toolbar">
                <select id="issue-level-filter">
                    <option value="">所有级别</option>
                    <option value="CRITICAL">CRITICAL</option>
                    <option value="HIGH">HIGH</option>
                    <option value="MEDIUM">MEDIUM</option>
                    <option value="LOW">LOW</option>
                </select>
                <select id="issue-category-filter">
                    <option value="">所有分类</option>
                </select>
            </div>
            <table id="issues-table">
                <thead>
                    <tr><th>级别</th><th>分类</th><th>标题</th><th>时间</th><th>状态</th></tr>
                </thead>
                <tbody></tbody>
            </table>
        </section>

        <!-- 动作 Tab -->
        <section id="tab-actions" class="tab-content">
            <div class="toolbar">
                <select id="action-type-filter">
                    <option value="">所有类型</option>
                    <option value="detect">检测</option>
                    <option value="direct_fix">直接修复</option>
                    <option value="heal">AI修复</option>
                    <option value="feature_dev">特性开发</option>
                    <option value="goal_decompose">目标分解</option>
                </select>
            </div>
            <div id="actions-timeline" class="timeline"></div>
        </section>

        <!-- 特性 Tab -->
        <section id="tab-features" class="tab-content">
            <!-- 特性统计卡片行 -->
            <div class="stats-grid" id="feature-stats-grid"></div>
            <div class="kanban">
                <div class="kanban-col" data-status="pending">
                    <h4>待处理</h4>
                    <div class="kanban-cards"></div>
                </div>
                <div class="kanban-col" data-status="developing">
                    <h4>开发中</h4>
                    <div class="kanban-cards"></div>
                </div>
                <div class="kanban-col" data-status="deployed">
                    <h4>已部署</h4>
                    <div class="kanban-cards"></div>
                </div>
                <div class="kanban-col" data-status="verified">
                    <h4>已验证</h4>
                    <div class="kanban-cards"></div>
                </div>
            </div>
        </section>

        <!-- 告警 Tab -->
        <section id="tab-alerts" class="tab-content">
            <div class="alerts-header">
                <h3>告警中心</h3>
                <span class="alerts-subtitle">聚合 Feature 失败和 Probe 异常事件</span>
            </div>
            <div id="alerts-list" class="alerts-list"></div>
        </section>

        <!-- 趋势 Tab -->
        <section id="tab-trends" class="tab-content">
            <div class="chart-container">
                <canvas id="kpi-chart"></canvas>
            </div>
            <div class="chart-container">
                <canvas id="actions-chart"></canvas>
            </div>
        </section>
    </main>

    <script src="/static/app.js"></script>

    <!-- 特性详情侧边栏 -->
    <div id="feature-sidebar" class="sidebar hidden">
        <div class="sidebar-header">
            <h3 id="sidebar-title"></h3>
            <button class="sidebar-close">&times;</button>
        </div>
        <div class="sidebar-body" id="sidebar-body"></div>
    </div>
</body>
</html>
