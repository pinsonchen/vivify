id: secrets_scan
description: Run gitleaks if installed; any hit is treated as CRITICAL.
enabled_by_default: true
remediation_hint: |
  Rotate the leaked credential immediately. Removing the secret from the
  current commit is not enough — purge it from git history with `git filter-repo`
  and force-push, then add a pre-commit hook to block recurrence.

config_overrides: {}

collect:
  steps:
    - shell: |
        if command -v gitleaks >/dev/null 2>&1; then
          gitleaks detect --no-banner --report-format=json --report-path=/tmp/auto_heal_leaks.json --redact --exit-code=0 2>/dev/null
          python3 -c "import json,os; print(len(json.load(open('/tmp/auto_heal_leaks.json'))) if os.path.exists('/tmp/auto_heal_leaks.json') else 0)" 2>/dev/null || echo 0
        else echo 0; fi
      as: leak_count
      coerce: int
      timeout_seconds: 180

analyze:
  rules:
    - when: "leak_count > 0"
      emit:
        category: secret_leak
        level: CRITICAL
        title: "{{ leak_count }} potential secrets detected by gitleaks"
        description: "Rotate any leaked credentials immediately and purge from git history."
        data:
          leak_count: "{{ leak_count }}"
