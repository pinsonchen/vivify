id: test_coverage
description: Detect when test coverage drops below a configured threshold.
enabled_by_default: true
remediation_hint: |
  Add targeted unit tests for the lowest-covered modules. Prefer covering
  branches with meaningful assertions over mechanically inflating line %.

config_overrides:
  threshold_percent: 80
  critical_percent: 50

collect:
  steps:
    - shell: |
        if [ -f coverage.json ]; then
          python3 -c "import json; print(json.load(open('coverage.json'))['totals']['percent_covered'])" 2>/dev/null || echo 0
        elif [ -f .coverage ]; then
          coverage json -q -o /tmp/auto_heal_cov.json 2>/dev/null \
            && python3 -c "import json; print(json.load(open('/tmp/auto_heal_cov.json'))['totals']['percent_covered'])" \
            || echo 0
        elif [ -f coverage/coverage-summary.json ]; then
          python3 -c "import json; d=json.load(open('coverage/coverage-summary.json')); print(d['total']['lines']['pct'])" 2>/dev/null || echo 0
        else echo -1; fi
      as: coverage_percent
      coerce: float
      timeout_seconds: 30

analyze:
  rules:
    - when: "coverage_percent >= 0 and coverage_percent < config.critical_percent"
      emit:
        category: test_coverage_critical
        level: CRITICAL
        title: "Test coverage critically low ({{ '%.1f' | format(coverage_percent) }}%)"
        description: "Coverage below critical threshold ({{ config.critical_percent }}%)."
        data:
          percent: "{{ coverage_percent }}"
    - when: "coverage_percent >= config.critical_percent and coverage_percent < config.threshold_percent"
      emit:
        category: test_coverage_low
        level: HIGH
        title: "Test coverage {{ '%.1f' | format(coverage_percent) }}% below {{ config.threshold_percent }}%"
        description: "Coverage regression; add tests for the lowest-covered modules."
        data:
          percent: "{{ coverage_percent }}"
          threshold: "{{ config.threshold_percent }}"
